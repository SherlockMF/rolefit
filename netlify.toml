# RoleFit — Netlify + Next.js (App Router)
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # 默认 mock；在 Netlify UI → Environment variables 覆盖 LLM_* 可接真实模型
  LLM_PROVIDER = "mock"
  NEXT_PUBLIC_LLM_PROVIDER = "mock"
  NEXT_PUBLIC_LLM_MODEL = "mock"
